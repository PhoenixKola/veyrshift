name: Source checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Initial scaffold intentionally has no registry-generated lockfile yet.
      # Replace npm install with npm ci after B00 generates and commits a valid lockfile.
      - name: Install
        run: npm install
      - name: Typecheck and build React frontend
        run: npm run build
      - name: Portable engine tests and preview
        run: npm run test
